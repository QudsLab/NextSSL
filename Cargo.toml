[workspace]
resolver = "2"
members = ["crates/*", "xtask", "algos/*/*/*"]
exclude = ["fuzz", "legacy"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.81"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
nextssl-core = { path = "crates/nextssl-core" }
nextssl-registry = { path = "crates/nextssl-registry" }
nextssl-compose = { path = "crates/nextssl-compose" }
nextssl = { path = "crates/nextssl" }
nextssl-root = { path = "crates/nextssl-root" }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto dependencies are far too slow unoptimized (SLH-DSA, scrypt). Our crates stay debuggable.
[profile.dev.package."*"]
opt-level = 2
