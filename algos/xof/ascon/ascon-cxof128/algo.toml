# Ascon-CXOF128 as in NIST SP 800-232 (ascon-c ref). Customization string param `custom` limited to 256 bytes (2048 bits) by glue. The KAT file has 64-byte outputs only; shorter outputs are checked as prefixes. Known gap (rule 9): the upstream keeps key-derived state on the stack and does not wipe it.

[params.custom]
type     = "bytes"
min      = 0
max      = 256
required = false

