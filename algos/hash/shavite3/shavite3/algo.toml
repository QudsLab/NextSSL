id        = "shavite3"
kind      = "hash"
category  = "hash"
family    = "shavite3"
aliases   = []
tier      = "research"
status    = "active"
standards = ["SHAvite-3 (SHA-3 round 2 candidate), sphlib implementation"]
fips      = false
copyleft  = false
upstream  = { repo = "https://github.com/pornin/sphlib", commit = "15b6b8d8f3e4a43c58ba102d712fa6b8a3317035", license = "MIT", files = ["c/shavite.c", "c/sph_shavite.h", "c/sph_types.h", "c/aes_helper.c", "LICENSE"] }
# Tier research: SHA-3 competition candidate that was not selected; not standardized. Owner may reclassify.
# Verbatim sphlib files (MIT, Projet RNRT SAPHIR); symbols prefixed by -D defines in build.rs, shim.c is NextSSL glue.
# Row note "verify 512-bit variant": sphlib has SHAvite-3_256 (224/256) and SHAvite-3_512 (384/512); all four are exposed via out_len and covered by NIST KATs.

[params.out_len]
type    = "u64"
min     = 28
max     = 64
default = 32

[kat]
files = ["kat/shavite3.json"]

[sizes]
out = { min = 28, max = 64 }
