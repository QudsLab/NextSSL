id        = "cubehash"
kind      = "hash"
category  = "hash"
family    = "cubehash"
aliases   = []
tier      = "research"
status    = "active"
standards = ["CubeHash16/32 (SHA-3 round 2/3 candidate), sphlib implementation"]
fips      = false
copyleft  = false
upstream  = { repo = "https://github.com/pornin/sphlib", commit = "15b6b8d8f3e4a43c58ba102d712fa6b8a3317035", license = "MIT", files = ["c/cubehash.c", "c/sph_cubehash.h", "c/sph_types.h", "LICENSE"] }
# Tier research: SHA-3 competition candidate that was not selected; not standardized. Owner may reclassify.
# Verbatim sphlib files (MIT, Projet RNRT SAPHIR); symbols prefixed by -D defines in build.rs, shim.c is NextSSL glue.
# Row note "verify round 2 vs 3": the NIST KAT digests in sphlib test_cubehash.c match this code, which is CubeHash16/32 (final tweak).

[params.out_len]
type    = "u64"
min     = 28
max     = 64
default = 32

[kat]
files = ["kat/cubehash.json"]

[sizes]
out = { min = 28, max = 64 }
