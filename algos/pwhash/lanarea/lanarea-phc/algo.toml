id       = "lanarea-phc"
kind      = "pwhash"
category  = "pwhash"
family    = "lanarea"
aliases   = []
tier      = "unverified"
status    = "active"
standards = ["Password Hashing Competition submission (2014-2015), PHC API PHS()"]
fips      = false
copyleft  = false
exclude_targets = ["msvc"]
exclude_reason = "MSVC cannot build the upstream C: lanarea.c: error C2061: syntax error: identifier 'diagonal_ur' (POSIX ssize_t)"
upstream  = { url = "https://password-hashing.net/submissions/Lanarea-v0.tar.gz", sha256 = "e51f23f8ea2f27d82767fe139a223a6e57f0aeab667d010fddcbaf696ec80145", license = "CC0-1.0", files = ["lanarea.c", "lanarea.h", "libb2/src/blake2.h", "libb2/src/blake2-impl.h", "libb2/src/blake2b-ref.c", "LICENSE"] }
# Upstream wants outlen a multiple of 32 and a non-empty password and salt (checked here). License text is libb2's COPYING (CC0); Lanarea itself states none. The lanarea.h PHS is a static inline wrapper.
# license file copied verbatim from the package (Lanarea-v0/Lanarea/libb2/COPYING). Tier unverified: PHC competition code, not independently reviewed (root API only). PHC string is NextSSL framing ($id$t=,m=$salt$hash). The upstream rng/main/test files are not compiled.
# no vectors replayed (untested, tier unverified). The package ships no test vector for this PHS entry point.

[params.t_cost]
type     = "u32"
min      = 1
max      = 8
default  = 1

[params.m_cost]
type     = "u32"
min      = 1
max      = 64
default  = 1

[params.out_len]
type     = "u32"
min      = 32
max      = 128
default  = 32

[kat]
files = ["kat/kat.json"]

[sizes]
salt = { min = 1, max = 64 }
out = { min = 32, max = 128 }
