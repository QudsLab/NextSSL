id       = "gambit-phc"
kind      = "pwhash"
category  = "pwhash"
family    = "gambit"
aliases   = []
tier      = "unverified"
status    = "active"
standards = ["Password Hashing Competition submission (2014-2015), PHC API PHS()"]
fips      = false
copyleft  = false
exclude_targets = ["msvc"]
exclude_reason = "MSVC cannot build the upstream C: keccak.cpp: error C2036: 'void *': unknown size (arithmetic on void pointers)"
upstream  = { url = "https://password-hashing.net/submissions/Gambit-v1.tar.gz", sha256 = "f61ad919084a8082b27c91e65824d7ce62e11aa33eb43627ede3f0f6676e1159", license = "NOASSERTION", files = ["gambit.cpp", "gambit.h", "keccak.cpp", "keccak.h", "LICENSE"] }
# Documented limits of gambit.h enforced here: salt exactly 16 bytes, password <= 151, output <= 168, m_cost odd and <= 17 * t_cost / 4 (m_cost = 64-bit words of memory). 'NOT a reference implementation' per the author. The 256-bit instance (PHS) only. No test vectors in the package.
# NO license file in the package: upstream/LICENSE is a NextSSL placeholder naming the manifest license; owner must add the real text (rule 8). Tier unverified: PHC competition code, not independently reviewed (root API only). PHC string is NextSSL framing ($id$t=,m=$salt$hash). The upstream rng/main/test files are not compiled.
# no vectors replayed (untested, tier unverified). The package ships no test vector for this PHS entry point.

[params.t_cost]
type     = "u32"
min      = 1
max      = 4096
default  = 4

[params.m_cost]
type     = "u32"
min      = 1
max      = 17407
default  = 1

[params.out_len]
type     = "u32"
min      = 16
max      = 168
default  = 32

[kat]
files = ["kat/kat.json"]

[sizes]
salt = { min = 16, max = 16 }
out = { min = 16, max = 168 }
