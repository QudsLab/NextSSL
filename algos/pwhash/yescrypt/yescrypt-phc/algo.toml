id       = "yescrypt-phc"
kind      = "pwhash"
category  = "pwhash"
family    = "yescrypt"
aliases   = []
tier      = "unverified"
status    = "active"
standards = ["Password Hashing Competition submission (2014-2015), PHC API PHS()"]
fips      = false
copyleft  = false
upstream  = { url = "https://password-hashing.net/submissions/yescrypt-v2.tar.gz", sha256 = "3d8566421bce945a5a1a0e837af095c22453bcbbac899c7a0fb450693be4c8fa", license = "NOASSERTION", files = ["yescrypt.h", "yescrypt-ref.c", "yescrypt-common.c", "yescrypt-platform.c", "sha256.c", "sha256.h", "sysendian.h", "phc.c", "LICENSE"] }
# PHC submission version 0.8.1 (distinct from the 1.x 'yescrypt'): phc.c PHS = yescrypt_kdf with YESCRYPT_RW, N = 8 << m_cost, r = 8, p = 1, t = t_cost. Portable yescrypt-ref.c core (no OpenMP, no SIMD). Sources carry a short 'redistribution and use ... are permitted' notice (no SPDX id, no license file).
# NO license file in the package: upstream/LICENSE is a NextSSL placeholder naming the manifest license; owner must add the real text (rule 8). Tier unverified: PHC competition code, not independently reviewed (root API only). PHC string is NextSSL framing ($id$t=,m=$salt$hash). The upstream rng/main/test files are not compiled.
# no vectors replayed (untested, tier unverified). The package ships no test vector for this PHS entry point.

[params.t_cost]
type     = "u32"
min      = 0
max      = 4
default  = 0

[params.m_cost]
type     = "u32"
min      = 0
max      = 12
default  = 4

[params.out_len]
type     = "u32"
min      = 16
max      = 1024
default  = 32

[kat]
files = ["kat/kat.json"]

[sizes]
salt = { min = 0, max = 64 }
out = { min = 16, max = 1024 }
