id        = "ed25519"
kind      = "sign"
category  = "sign"
family    = "eddsa"
aliases   = ["ed25519-pure", "eddsa-ed25519"]
tier      = "standard"
status    = "active"
standards = ["RFC 8032", "FIPS 186-5", "RFC 9864"]
# COSE -19 = Ed25519 (RFC 9864, fully specified, recommended). -8 "EdDSA" is deprecated by RFC 9864
# because it does not name the curve.
cose_alg  = -19
oid       = "1.3.101.112"
fips      = true
copyleft  = false
upstream  = { crate = "ed25519-dalek", version = "=3.0.0", license = "BSD-3-Clause" }

[kat]
files = ["kat/rfc8032-7.1.json", "kat/wycheproof-ed25519_test.json"]

# sk is the 32-byte RFC 8032 secret seed. Pure Ed25519 has no context string (ctx = 0).
[sizes]
pk   = 32
sk   = 32
sig  = 64
seed = 32
ctx  = 0
