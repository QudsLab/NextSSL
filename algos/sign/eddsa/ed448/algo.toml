id        = "ed448"
kind      = "sign"
category  = "sign"
family    = "eddsa"
aliases   = ["ed448-pure", "eddsa-ed448"]
tier      = "standard"
status    = "active"
standards = ["RFC 8032", "FIPS 186-5", "RFC 9864"]
cose_alg  = -53  # IANA COSE Ed448 (RFC 9864)
oid       = "1.3.101.113"
fips      = true
copyleft  = false
upstream  = { crate = "ed448-goldilocks", version = "=0.14.0-pre.15", license = "Apache-2.0 OR MIT" }
# RustCrypto ed448-goldilocks 0.14.0-pre.15 (a pre-release: the 0.9.0 named in sources_C.csv is a curve-arithmetic crate without signatures). Pinned exactly. Pure Ed448 with an RFC 8032 context string of 0..=255 bytes; Ed448ph is not included.
[kat]
files = ["kat/rfc8032-7.4.json", "kat/wycheproof-ed448_test.json", "kat/acvp-eddsa-ed448.json"]

# sk is the 57-byte RFC 8032 secret seed.
[sizes]
pk   = 57
sk   = 57
sig  = 114
seed = 57
ctx  = { min = 0, max = 255 }
