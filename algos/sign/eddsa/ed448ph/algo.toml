# Prehash is SHAKE256 with a 64-byte output, computed with the vendored crate's own SHAKE256 because the upstream leaves that step to the caller.
# Upstream PrivateKey is Copy and is not zeroized on drop (hard rule 9 cannot be met by the glue).

