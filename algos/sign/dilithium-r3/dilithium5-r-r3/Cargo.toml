[package]
name = "nextssl-algo-dilithium5-r-r3"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
path = "glue.rs"

[dependencies]
nextssl-core.workspace = true
zeroize.workspace = true

[dev-dependencies]
nextssl-core = { workspace = true, features = ["testing"] }

[build-dependencies]
cc = "1"
object = { version = "0.37", default-features = false, features = ["read_core", "std", "coff", "elf", "macho", "wasm"] }

# Per-algo C wrapper: the only place besides nextssl-ffi allowed to use unsafe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
