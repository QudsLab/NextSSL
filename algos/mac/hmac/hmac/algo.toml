id        = "hmac"
kind      = "mac"
category  = "mac"
family    = "hmac"
aliases   = []
tier      = "standard"
status    = "active"
standards = ["RFC 2104", "FIPS 198-1", "RFC 4231", "NIST SP 800-224 (HMAC-SHA3)"]
fips      = true
copyleft  = false
upstream  = { crate = "hmac", version = "=0.13.0", license = "MIT OR Apache-2.0" }
# Also depends on RustCrypto `sha2` =0.11.1 and `sha3` =0.11.0 (MIT OR Apache-2.0).
# Generic HMAC over a closed set of sound hashes. MD5/SHA-1 are NOT selectable here
# (use hmac-md5 / hmac-sha1, tier legacy), so this id can be tier standard.

[params.hash]
type    = "enum"
values  = ["sha256", "sha384", "sha512", "sha224", "sha512-224", "sha512-256", "sha3-224", "sha3-256", "sha3-384", "sha3-512"]
default = "sha256"

[kat]
files = ["kat/rfc4231.json", "kat/py-hmac.json", "kat/wycheproof_hmac_sha256_test.json", "kat/wycheproof_hmac_sha512_test.json", "kat/wycheproof_hmac_sha3_256_test.json", "kat/wycheproof_hmac_sha3_384_test.json", "kat/wycheproof_hmac_sha3_512_test.json"]
# Wycheproof (C2SP/wycheproof @ d17cc89fa5c8f4f4d378b5385ebf75da5d0926c9) copied verbatim from the sibling hmac-* ids.

[sizes]
key = { min = 1, max = 268435456 }
tag = { min = 16, max = 64 }
