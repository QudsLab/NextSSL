id        = "siphash-4-8"
kind      = "mac"
category  = "mac"
family    = "siphash"
aliases   = []
tier      = "standard"
status    = "active"
standards = ["SipHash (Aumasson, Bernstein), reference C"]
fips      = false
copyleft  = false
upstream  = { repo = "https://github.com/veorq/SipHash", commit = "32d067603b93b47828700880649198e0bfbbcffa", license = "CC0-1.0", files = ["siphash.c", "siphash.h", "LICENSE"] }
# SipHash-4-8 (SipHash with c=4, d=8 rounds). Not in the siphasher crate; same C file as siphash-2-4 built with -DcROUNDS=4 -DdROUNDS=8.
# KAT is independent (OpenSSL), see kat/README.md. Keyed PRF; 64-bit tags are not collision resistant.
# Known gap (rule 9): upstream siphash.c keeps key-derived state on the stack and does not wipe it.

[params.out_len]
type    = "u64"
min     = 8
max     = 16
default = 8

[kat]
files = ["kat/siphash-4-8.json"]

[sizes]
key = 16
tag = { min = 8, max = 16 }
