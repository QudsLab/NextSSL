id        = "ff70"
kind      = "encoding"
category  = "encoding"
family    = "ff70"
aliases   = ["flexframe-70"]
tier      = "unverified"
status    = "active"
standards = []
fips      = false
copyleft  = false
# Owner's own encoding (FlexFrame-70), rewritten in safe Rust from the owner-supplied C reference
# (collection/encoding/ff70/ff70/upstream/ff70.c, see upstream/ORIGIN.md). Only the BLAKE3 checksum
# comes from an upstream crate. License: as the repository (Apache-2.0).
upstream  = { crate = "blake3", version = "=1.8.7", license = "CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception" }
# Frame: [Header](Config){Data|Sum}[Meta]. The 4-byte BLAKE3 checksum is an error check only; it gives
# no integrity against an attacker. `|` is in the 70-symbol alphabet but always excluded (real base 69).

[params.header]
type = "str"
min  = 0
max  = 31

[params.exclude]
type = "str"
min  = 0
max  = 62

[params.meta]
type = "str"
min  = 0
max  = 127

[kat]
files = ["kat/vectors.json"]
