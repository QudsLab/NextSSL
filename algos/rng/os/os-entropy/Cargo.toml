[package]
name = "nextssl-algo-os-entropy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "glue.rs"

[dependencies]
nextssl-core.workspace = true
getrandom = { version = "=0.4.3", default-features = false }

# Browser wasm has no OS RNG; getrandom uses crypto.getRandomValues through wasm-bindgen.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "=0.4.3", default-features = false, features = ["wasm_js"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
