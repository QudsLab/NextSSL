id        = "aes-kw"
kind      = "blockmode"
category  = "mode"
family    = "aes-kw"
aliases   = ["aes-key-wrap", "kw"]
tier      = "standard"
status    = "active"
standards = ["NIST SP 800-38F", "RFC 3394"]
fips      = true
copyleft  = false
upstream  = { crate = "aes-kw", version = "=0.3.1", license = "MIT OR Apache-2.0" }
# AES Key Wrap (RFC 3394): encrypt = wrap, decrypt = unwrap. No nonce (size 0). A failed integrity check is
# `AuthenticationFailed` and no key bytes are released. Key data must be a multiple of 8 bytes and at least 16
# bytes.

[kat]
files = ["kat/acvp-kw.json"]

[sizes]
key = { min = 16, max = 32 }
nonce = 0
block = 16
