# Wired: comp128v1() from libosmocore src/gsm/comp128.c (GSM A3/A8 authentication, leaked/reverse-engineered algorithm, not published by 3GPP).
# Kind kdf is the honest closest fit: ikm = Ki (16 bytes), salt = RAND (16 bytes), info = none (non-empty is an error), out = SRES (4) || Kc (8) = exactly 12 bytes.
# COMP128v1 is broken (partitioning attack recovers Ki from a few thousand challenges).
# GPL-2.0-or-later upstream: copyleft = true.
# KAT: none in libosmocore for v1 (tests/comp128/comp128_test.c only has v2/v3); never invented.


