[package]
name = "nextssl-algo-hkdf-sha256"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "glue.rs"

[dependencies]
nextssl-core.workspace = true
hkdf = { version = "=0.13.0", default-features = false }
# Direct dependency only to switch on `zeroize` for the HMAC state HKDF keeps (same pinned version).
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.11.1", default-features = false }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
