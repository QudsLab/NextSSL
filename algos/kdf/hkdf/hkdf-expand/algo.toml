id        = "hkdf-expand"
kind      = "kdf"
category  = "kdf"
family    = "hkdf"
aliases   = []
tier      = "standard"
status    = "active"
standards = ["RFC 5869", "NIST SP 800-56C"]
fips      = true
copyleft  = false
upstream  = { crate = "hkdf", version = "=0.13.0", license = "MIT OR Apache-2.0" }
# Also depends on RustCrypto `sha2` =0.11.1 and `sha3` =0.11.0 (MIT OR Apache-2.0).
# HKDF-Expand only: derive(ikm = PRK, salt, info, out); salt must be empty (salt = 0).

[params.hash]
type    = "enum"
values  = ["sha256", "sha384", "sha512", "sha224", "sha512-224", "sha512-256", "sha3-224", "sha3-256", "sha3-384", "sha3-512"]
default = "sha256"

[kat]
files = ["kat/vectors.json"]

[sizes]
key = { min = 28, max = 268435456 }
out = { min = 1, max = 16320 }
salt = 0
