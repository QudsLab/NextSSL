id        = "aes-256-ctr"
kind      = "streamcipher"
category  = "stream"
family    = "aes-ctr"
aliases   = ["aes256-ctr"]
tier      = "standard"
status    = "active"
standards = ["NIST SP 800-38A"]
fips      = true
copyleft  = false
upstream  = { crate = "ctr", version = "=0.10.1", license = "MIT OR Apache-2.0" }
# Also depends on RustCrypto `aes` =0.9.4 (MIT OR Apache-2.0) for the block cipher.

[kat]
files = ["kat/sp800-38a.json", "kat/xcheck-wrap.json"]

# nonce is the full 16-byte initial counter block; the whole block is a 128-bit big-endian counter.
[sizes]
key   = 32
nonce = 16
