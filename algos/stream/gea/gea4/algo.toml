id        = "gea4"
kind      = "streamcipher"
category  = "stream"
family    = "gea"
aliases   = []
tier      = "legacy"
status    = "active"
standards = ["3GPP TS 55.226"]
fips      = false
copyleft  = true
upstream  = { repo = "https://github.com/osmocom/libosmocore", commit = "1b72c0288c3f6fcec916cc439623af1c1c4b5d4c", license = "GPL-2.0-or-later", files = ["include/osmocom/core/defs.h", "include/osmocom/core/bits.h", "include/osmocom/core/bitXXgen.h.tpl", "include/osmocom/gsm/gea.h", "include/osmocom/gsm/kasumi.h", "src/gsm/kasumi.c", "src/gsm/gea.c", "LICENSE"] }
# Wired: gea4() from libosmocore src/gsm/gea.c (KASUMI KGCORE, src/gsm/kasumi.c); 3GPP TS 55.226.
# Nonce encoding (ours, shim.c + glue.rs): 5 bytes = the 32-bit GPRS cipher INPUT (big endian) followed by the direction byte (0 = MS to SGSN, 1 = SGSN to MS; anything else is an error).
# Data length is limited to 1523 bytes (GSM 04.64 maximum block; upstream takes the bit count in a uint16 and would wrap above 8191 bytes); longer is an error.
# GPL-2.0-or-later upstream: copyleft = true. Key is exactly 16 bytes (GEA3 expands an 8-byte Kc by C4 inside upstream; shim.c holds a verbatim excerpt of osmo_c4).
# KAT: the 3 test vectors of tests/gea/gea_test.c published in 3GPP TS 55.226; zero data, so out = keystream.


[kat]
files = ["kat/kat.json"]

[sizes]
key = 16
nonce = 5
