id        = "aes-256-ofb"
kind      = "streamcipher"
category  = "stream"
family    = "aes-ofb"
aliases   = ["aes256-ofb"]
tier      = "standard"
status    = "active"
standards = ["NIST SP 800-38A"]
fips      = true
copyleft  = false
upstream  = { crate = "ofb", version = "=0.7.1", license = "MIT OR Apache-2.0" }
# OFB mode (full-block feedback). nonce is the 16-byte IV; never reuse an IV under one key. Also depends on
# RustCrypto aes 0.9.4.

[kat]
files = ["kat/acvp-ofb.json"]

[sizes]
key = 32
nonce = 16
