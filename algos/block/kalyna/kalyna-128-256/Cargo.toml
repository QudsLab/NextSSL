[package]
name = "nextssl-algo-kalyna-128-256"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
path = "glue.rs"

[dependencies]
nextssl-core.workspace = true
zeroize.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json.workspace = true

# Per-algo C wrapper: the only place besides nextssl-ffi allowed to use unsafe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
