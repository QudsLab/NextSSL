# Tier unverified: single unofficial mirror of the Ukrainian reference implementation (mouse07410/kalyna), provenance of the code unproven; the vectors are those in its main.c (they match the DSTU 7624 test vectors as published, but the standard text was not available to compare).
# Kalyna block 128 bits, key 256 bits. Sibling ids carry the other sizes. Words are little-endian as in the reference. Known gap (rule 9): the upstream context holds round keys in heap memory that KalynaDelete frees without wiping.

[kat]
files = ["kat/kalyna-128-256.json"]

[sizes]
key = 32
block = 16
