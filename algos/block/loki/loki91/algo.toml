# Wired: enloki/deloki/setlokikey from loki91.c (Lawrie Brown and Matthew Kwan, UNSW/ADFA, loki-3.0 of the funet archive): LOKI91, the upgraded LOKI (13-bit key rotation, new S-box base).
# Key exactly 8 bytes, block exactly 8 bytes. The upstream keeps its key state in statics (the 16 subkeys): the glue serialises every call with a process-wide Mutex and wipes it after each call.
# Historic K&R C with a 32-bit `long`: compat/pre.h (ours) redefines `long` to `int` for the upstream sources and sets LITTLE_ENDIAN; the build also demotes gcc/clang implicit-int and implicit-declaration errors to warnings. The upstream files are unchanged.
# License: copyright 1989 Lawrie Brown and UNSW, 'may not be sold or used as inducement to buy a product without the written permission of the author' (file header); no license file in the package: license NOASSERTION, placeholder in upstream/LICENSE, owner must review this restriction.
# KAT: the first 5 certification triples (key, plaintext, ciphertext) of triple91 in the package (the cipher's validation suite, same-author); the package's single91.log trace agrees with triple1 of that suite.


[kat]
files = ["kat/kat.json"]

[sizes]
key = 8
block = 8
