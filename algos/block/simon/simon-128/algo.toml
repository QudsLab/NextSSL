id        = "simon-128"
kind      = "blockcipher"
category  = "block"
family    = "simon"
aliases   = []
tier      = "unverified"
status    = "active"
standards = ["SIMON128/128, /192 and /256 (NSA, 2013), Crypto++ implementation"]
fips      = false
copyleft  = false
upstream  = { repo = "https://github.com/weidai11/cryptopp", commit = "5873a73a231c95771f5bbf3466a484952fb22780", license = "BSL-1.0", files = ["aes.h", "algparam.cpp", "algparam.h", "allocate.cpp", "allocate.h", "argnames.h", "config.h", "config_align.h", "config_asm.h", "config_cpu.h", "config_cxx.h", "config_dll.h", "config_int.h", "config_misc.h", "config_ns.h", "config_os.h", "config_ver.h", "cpu.h", "cryptlib.cpp", "cryptlib.h", "filters.cpp", "filters.h", "fips140.cpp", "fips140.h", "fltrimpl.h", "hkdf.h", "hmac.h", "integer.h", "iterhash.h", "misc.cpp", "misc.h", "mqueue.cpp", "mqueue.h", "osrng.h", "pch.h", "queue.cpp", "queue.h", "randpool.h", "rijndael.h", "rng.h", "secblock.h", "secblockfwd.h", "seckey.h", "sha.h", "simon.cpp", "simon.h", "simple.h", "smartptr.h", "stdcpp.h", "trap.h", "words.h", "LICENSE"] }
# Crypto++ is compiled verbatim as C++17 (portable: CRYPTOPP_DISABLE_ASM, CRYPTOPP_DISABLE_SSE2, CRYPTOPP_NO_ASSIGN_TO_INTEGER) with the namespace CryptoPP renamed by a -D define per id; shim.cpp is ours.
# License: the library is Boost Software License 1.0 (upstream/LICENSE is Crypto++ License.txt, verbatim; it also lists individual files placed in the public domain by their authors).
# Link support in shim.cpp (not crypto): IntToString<word64> copied from integer.cpp (big-integer code is not compiled) and explicit instantiations of AlgorithmParametersTemplate (dll.cpp is not compiled).
# Key lengths accepted: 16, 24, 32 bytes (glue rejects every other length).
# KAT: first vectors of TestVectors/simon.txt in the pinned clone (6 vectors; Crypto++ own test data, same-source).

[kat]
files = ["kat/kat.json"]

[sizes]
key = { min = 16, max = 32 }
block = 16
