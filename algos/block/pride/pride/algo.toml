id        = "pride"
kind      = "blockcipher"
category  = "block"
family    = "pride"
aliases   = []
tier      = "unverified"
status    = "active"
standards = []
fips      = false
copyleft  = true
upstream  = { repo = "https://github.com/obfusk/pypride", commit = "97d724c086a0f498bdd049ddaf0b6f9e30822492", license = "LGPL-3.0-or-later", files = ["port/pride.c", "port/pride.h", "LICENSE"] }
# Port exception (hard rule 1): PRIDE (CRYPTO 2014), 64-bit block, 128-bit key, 20 rounds (the original's default).
# Line-by-line C port of the original Python source (pypride.py); the original is not copied, only translated. Tier unverified (root only).
# Differential test against the original (run in Docker, --network none, disposable copy): see kat/README.md and upstream/ORIGIN.md. Not compiled or tested in cargo at wiring time (owner order).
# LGPL-3.0-or-later source: reachable only with the `copyleft` cargo feature.
[kat]
files = ["kat/kat.json", "kat/published.json"]

[sizes]
key = 16
block = 8
