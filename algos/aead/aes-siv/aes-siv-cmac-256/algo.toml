id        = "aes-siv-cmac-256"
kind      = "aead"
category  = "aead"
family    = "aes-siv"
aliases   = ["aes-128-siv"]
tier      = "standard"
status    = "active"
standards = ["RFC 5297"]
fips      = false
copyleft  = false
upstream  = { crate = "aes-siv", version = "=0.8.0", license = "Apache-2.0 OR MIT" }
# Deterministic AEAD (AES-SIV-CMAC, RFC 5297) with a single associated-data header and no nonce (nonce size 0: a
# non-empty nonce is an error). Key is two AES keys (32 bytes). Same key + same input gives the same output.
# RFC 5297 multi-header and nonce-header forms are not offered; the 384-bit-key variant (AES-192) has no crate
# type.

[kat]
files = ["kat/wycheproof.json"]

[sizes]
key = 32
nonce = 0
tag = 16
