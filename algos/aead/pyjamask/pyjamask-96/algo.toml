# Not a NIST standard; NIST LWC candidate. Tier research keeps it on the root API only.
# Family member: Pyjamask-96-AEAD, 8-byte nonce, 12-byte tag; a 96-bit block OCB is weak after about 2^48 blocks. Sibling ids carry the other sizes because the generic tests need fixed metadata sizes per id. Known gap (rule 9): the upstream keeps key-derived state on the stack and does not wipe it.

