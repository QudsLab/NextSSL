id        = "isaac64"
kind      = "prng"
category  = "prng"
family    = "isaac"
aliases   = []
tier      = "unverified"
status    = "active"
standards = ["ISAAC-64 (Jenkins 1996), NOT cryptographically secure for new designs"]
fips      = false
copyleft  = false
upstream  = { crate = "rand_isaac", version = "=0.5.1", license = "MIT OR Apache-2.0" }
# NOT a cryptographic generator (kind prng is root only). //! ISAAC-64.

# Seed 32 bytes; the stream is the upstream fill_bytes (little-endian words). Wired in batch 9, not compiled or
# tested at wiring time (owner order); KAT file empty, no published vector was matched.

[kat]
files = ["kat/isaac64.json"]

[sizes]
seed = 32
out = { min = 1, max = 268435456 }
