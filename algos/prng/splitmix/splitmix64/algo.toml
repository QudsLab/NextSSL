id        = "splitmix64"
kind      = "prng"
category  = "prng"
family    = "splitmix"
aliases   = []
tier      = "unverified"
status    = "active"
standards = ["SplitMix64 (Steele, Lea, Flood 2014; Vigna), NOT cryptographically secure"]
fips      = false
copyleft  = false
upstream  = { crate = "rand_xoshiro", version = "=0.8.1", license = "MIT OR Apache-2.0" }
# NOT a cryptographic generator (kind prng is root only). //! Seed is one little-endian u64 state.

# Seed 8 bytes; the stream is the upstream fill_bytes (little-endian words). Wired in batch 9, not compiled or
# tested at wiring time (owner order); KAT file empty, no published vector was matched.

[kat]
files = ["kat/splitmix64.json"]

[sizes]
seed = 8
out = { min = 1, max = 268435456 }
