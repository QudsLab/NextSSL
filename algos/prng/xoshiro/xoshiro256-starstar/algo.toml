id        = "xoshiro256-starstar"
kind      = "prng"
category  = "prng"
family    = "xoshiro"
aliases   = []
tier      = "unverified"
status    = "active"
standards = ["xoshiro256** (Blackman, Vigna 2018), NOT cryptographically secure"]
fips      = false
copyleft  = false
upstream  = { crate = "rand_xoshiro", version = "=0.8.1", license = "MIT OR Apache-2.0" }
# NOT a cryptographic generator (kind prng is root only). //! All-zero seeds are refused (upstream would substitute one).

# Seed 32 bytes; the stream is the upstream fill_bytes (little-endian words). Wired in batch 9, not compiled or
# tested at wiring time (owner order); KAT file empty, no published vector was matched.

[kat]
files = ["kat/xoshiro256-starstar.json"]

[sizes]
seed = 32
out = { min = 1, max = 268435456 }
