name: platform
# One platform's chain, called by ci.yml once per platform: test (3 shards in parallel) -> pre-release.
# Each platform runs its own chain, so a fast platform releases without waiting for a slow one.
# The release libraries are built by test shard 3 right after its tests (shards 2 and 3 finish long
# before shard 1, which builds every algorithm library), so the release build overlaps shard 1
# instead of following it, without taking another runner (GitHub runs about 20 jobs at once; in run
# 45775068475 three jobs waited 13-16 min for a runner). The pre-release is published only after all
# 3 shards, and so every test of the platform, passed.
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      release:
        required: true
        type: boolean

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CACHE_VERSION: ccache-v1

jobs:
  test:
    name: test ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Registry and git checkouts only (rust-cache cannot hold the 1924-member workspace state).
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Several C upstreams need clang-cl on MSVC targets; the arm64 image has no LLVM.
      - name: clang-cl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\clang-cl.exe')) { choco install llvm -y --no-progress }
      - name: C library cache directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ccache"
          touch "$RUNNER_TEMP/ccache-stamp"
          echo "NEXTSSL_C_CACHE=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CACHE_VERSION }}-${{ inputs.name }}-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VERSION }}-${{ inputs.name }}-
      # Test results (tools/testrun.py --result-cache): a crate whose inputs are bit for bit those of an
      # earlier passing run is not built or tested again.
      - name: Result cache directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          echo "RESULT_FLAGS=--result-cache $RUNNER_TEMP/results" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/results
          key: results-v1-${{ inputs.name }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: results-v1-${{ inputs.name }}-${{ matrix.shard }}-
      - name: C toolchain versions
        shell: bash
        run: |
          cc --version 2>/dev/null | head -1 || true
          clang --version 2>/dev/null | head -1 || true
          if [ "$RUNNER_OS" = Windows ]; then "/c/Program Files/LLVM/bin/clang-cl.exe" --version | head -1; fi
      # Every test in its own process with a time limit; nothing stops the run. The registry smoke
      # walks the whole catalog: 4 algorithms (or KAT files) at a time inside it, up to 900 s each,
      # and a 1 h limit for the crate.
      - name: Build, lint and test (shard ${{ matrix.shard }}/3)
        shell: bash
        env:
          SMOKE_JOBS: '4'
        run: >-
          python tools/testrun.py --out test-report --timings --clippy --shard ${{ matrix.shard }}/3 $RESULT_FLAGS
          --umbrella-features nextssl-registry/copyleft,nextssl-registry/all-heavy
          --timeout 600 --crate-timeout nextssl-registry=3600 -- --workspace
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-report-${{ inputs.name }}-${{ matrix.shard }}
          path: test-report/
          if-no-files-found: warn
      # Shard 1 builds every library of the platform; keep only the entries this run used.
      - name: Prune the C library cache
        if: ${{ !cancelled() && matrix.shard == 1 && github.event_name == 'push' }}
        shell: bash
        run: python tools/ccache_prune.py "$NEXTSSL_C_CACHE" "$RUNNER_TEMP/ccache-stamp"
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && matrix.shard == 1 && github.event_name == 'push' }}
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CACHE_VERSION }}-${{ inputs.name }}-${{ github.run_id }}
      # Passing crates are recorded even when another crate failed; a failing crate's entry is removed.
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          path: ${{ runner.temp }}/results
          key: results-v1-${{ inputs.name }}-${{ matrix.shard }}-${{ github.run_id }}
      # Release libraries (main only), on shard 3 after its tests passed, with their own C library
      # cache (release-<platform>): a library is reused only when every input digest matches. The test
      # build is removed first to keep the runner's disk free.
      - name: Free the test build
        if: inputs.release && matrix.shard == 3
        shell: bash
        run: |
          rm -rf target/debug
          mkdir -p "$RUNNER_TEMP/ccache-release"
          touch "$RUNNER_TEMP/ccache-release-stamp"
      - uses: actions/cache/restore@v6
        if: inputs.release && matrix.shard == 3
        with:
          path: ${{ runner.temp }}/ccache-release
          key: ${{ env.CACHE_VERSION }}-release-${{ inputs.name }}-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VERSION }}-release-${{ inputs.name }}-
      - name: Release build
        if: inputs.release && matrix.shard == 3
        shell: bash
        run: NEXTSSL_C_CACHE="$RUNNER_TEMP/ccache-release" cargo build -p nextssl-ffi --release --locked
      - name: Prune the release C library cache
        if: inputs.release && matrix.shard == 3
        shell: bash
        run: python tools/ccache_prune.py "$RUNNER_TEMP/ccache-release" "$RUNNER_TEMP/ccache-release-stamp"
      - uses: actions/cache/save@v6
        if: inputs.release && matrix.shard == 3
        with:
          path: ${{ runner.temp }}/ccache-release
          key: ${{ env.CACHE_VERSION }}-release-${{ inputs.name }}-${{ github.run_id }}
      - name: Package
        if: inputs.release && matrix.shard == 3
        shell: bash
        run: bash tools/release_package.sh "${{ inputs.name }}"
      - uses: actions/upload-artifact@v7
        if: inputs.release && matrix.shard == 3
        with:
          name: release-${{ inputs.name }}
          path: dist/
          if-no-files-found: error

  # This platform's own pre-release, once its 3 test shards (shard 3 with the release build) passed;
  # the final release v<version> (ci.yml) comes only after every platform passed. Publishing needs no
  # build, so it runs on a Linux runner for every platform.
  release:
    name: pre-release
    needs: test
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ inputs.name }}
          path: dist
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci_release.sh platform "${{ inputs.name }}"
