name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every push to main (owner decision 2026-11-24) builds, lints and tests every algorithm on every
# platform. A version is published once (owner decision 2026-11-27, release.toml): when guard finds no
# release v<version> for Cargo.toml's version, the run also builds the release libraries; each platform
# publishes its pre-release v<version>-<platform> as soon as its chain is green, and the release
# v<version> follows when every platform is green (no drafts). Every other run only builds and tests.
# Pull requests run the same checks without a release.
#
# Pipeline (owner decision 2026-11-24: stages one after another, each platform on its own line):
#   guard  ->  <platform> test 1/3, 2/3, 3/3 (3/3 + release build)  ->  <platform> pre-release  ->  release
#          ->  wasm 1/2, 2/2 (2/2 + browser module)                  ->  wasm pre-release        ->
#          ->  asan 1/3, 2/3, 3/3, symbols, miri, fuzz-smoke                        ->
# * guard: the checks that do not depend on the platform (generated files, change paper, rustfmt),
#   a few minutes; nothing else starts when they fail.
# * Each platform chain is .github/workflows/platform.yml; a platform's release libraries are built
#   by its test shard 3 after that shard's tests, alongside shard 1, and published only after all 3
#   shards passed, without waiting for the other platforms.
# * Shards are of about equal expected time (tools/testrun.py --shard, tools/ci_weights.tsv); shard 1
#   also tests the crates that link the whole catalog (registry, ffi, root), copyleft and heavy on.
# * clippy runs in the same compile as the tests (testrun.py --clippy), warnings are errors.
# * Every test runs in its own process with a time limit; a failure, crash or hang fails only that
#   test and is reported per algorithm in the artifact test-report-<job>.
# * C library cache (crates/nextssl-cbuild): a compiled, renamed static library is reused only when
#   two digests (SHA-256 and BLAKE3) of every input match bit for bit. Test and release builds keep
#   separate caches (different optimisation levels); only runs on main write them.
# * Result cache (tools/testrun.py --result-cache): a crate whose inputs (its family directory, its
#   path dependencies, third_party/, docker/, Cargo.lock, the toolchain (in docker: the layers of the
#   Dockerfile's toolchain stage), the build environment and
#   the test options) are bit for bit those of an earlier run where it compiled and all its tests
#   passed is not built or tested again; the report counts it as cached.
# * Docker layer cache: in the GitHub container registry (ghcr.io/<owner>/nextssl-buildcache, with
#   the workflow's own GITHUB_TOKEN), not in the 10 GB Actions cache; only pushes to main write it.
# * release: v<version> with every platform's files, after every job above passed and the archives
#   were checked (tools/ci_release.sh final); marked pre-release while release.toml says so.
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CACHE_VERSION: ccache-v1

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Generated files, change paper, formatting, Python tools
        run: |
          cargo xtask gen --check
          python3 tools/upstream_changes.py --check
          python3 tools/release_info.py --check
          python3 tools/licenses_gen.py --check
          cargo fmt --all --check
          python3 -m py_compile tools/*.py
      # A push to main publishes Cargo.toml's version once: only while no release v<version> exists.
      - name: Release of this version needed
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 tools/release_info.py tag)
          main=no
          [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ] && main=yes
          if [ "$main" = yes ] && ! gh release view "$tag" --json tagName > /dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "$tag is not published yet: this run builds and publishes it." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No release in this run ($tag is published already, or not a push to main)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  linux-x64:
    needs: guard
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/platform.yml
    with: { name: linux-x64, os: ubuntu-latest, release: "${{ needs.guard.outputs.release == 'true' }}" }
  linux-arm64:
    needs: guard
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/platform.yml
    with: { name: linux-arm64, os: ubuntu-24.04-arm, release: "${{ needs.guard.outputs.release == 'true' }}" }
  windows-x64:
    needs: guard
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/platform.yml
    with: { name: windows-x64, os: windows-latest, release: "${{ needs.guard.outputs.release == 'true' }}" }
  windows-arm64:
    needs: guard
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/platform.yml
    with: { name: windows-arm64, os: windows-11-arm, release: "${{ needs.guard.outputs.release == 'true' }}" }
  macos-arm64:
    needs: guard
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/platform.yml
    with: { name: macos-arm64, os: macos-latest, release: "${{ needs.guard.outputs.release == 'true' }}" }

  # Docker jobs: wasm (both wasm targets, tests in wasmtime) and the slow layers, in the same image the
  # owner uses locally (docker/Dockerfile.test); docker/test.sh selects the work from the env flags.
  docker:
    needs: guard
    permissions:
      contents: read
      packages: write
    name: ${{ matrix.layer }}${{ matrix.part && format(' {0}/{1}', matrix.part, matrix.parts) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shard counts from run 45679985523 (4 vCPU runners). Shard 1 builds every algorithm library
          # (the registry links them all), so it has a floor no shard count lowers: asan about 66 min,
          # wasm about 34 min. The other shards get the fewest parts that keep each one below that floor
          # and below 50 min: asan 2 parts were 62 min, 3 parts are about 41 and 46 min; wasm 2/2 is
          # about 43 min with the browser module, which the last shard builds (docker/test.sh).
          - { layer: wasm, env: NEXTSSL_WASM=1, part: '1', parts: '2' }
          - { layer: wasm, env: NEXTSSL_WASM=1, part: '2', parts: '2' }
          - { layer: asan, env: NEXTSSL_ASAN=1, part: '1', parts: '3' }
          - { layer: asan, env: NEXTSSL_ASAN=1, part: '2', parts: '3' }
          - { layer: asan, env: NEXTSSL_ASAN=1, part: '3', parts: '3' }
          - { layer: symbols, env: NEXTSSL_SYMBOLS=1, part: '', parts: '' }
          - { layer: miri, env: NEXTSSL_MIRI=1, part: '', parts: '' }
          - { layer: fuzz-smoke, env: NEXTSSL_FUZZ_SECS=30, part: '', parts: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Layer cache reference
        run: echo "BUILDCACHE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nextssl-buildcache:test" >> "$GITHUB_ENV"
      # A failed login only loses the layer cache; the image is then built from scratch.
      - uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.test
          tags: nextssl-test
          load: true
          cache-from: type=registry,ref=${{ env.BUILDCACHE }}
          cache-to: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.layer == 'symbols') && format('type=registry,ref={0},mode=max', env.BUILDCACHE) || '' }}
      # The toolchain stage alone (already built above, so this only loads it): its layer digests key
      # the result cache. The full image's id changes with every commit (COPY . .), which made every
      # docker shard rerun all of its crates: run 45679985523, asan 2/2 and wasm 2/2 ran 988 of 988
      # test binaries while linux-x64 test 2/3 of the same commit ran 59.
      - name: Toolchain stage
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.test
          target: toolchain
          tags: nextssl-toolchain
          load: true
          cache-from: type=registry,ref=${{ env.BUILDCACHE }}
      - name: Toolchain fingerprint
        run: |
          fp=$(docker image inspect nextssl-toolchain --format '{{json .RootFS.Layers}}' | sha256sum | cut -c1-64)
          echo "toolchain layers: $fp"
          echo "TOOLCHAIN_FP=$fp" >> "$GITHUB_ENV"
      - name: C library cache directory
        run: |
          mkdir -p "$RUNNER_TEMP/ccache" test-report wasm-out
          touch "$RUNNER_TEMP/ccache-stamp"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CACHE_VERSION }}-${{ matrix.layer }}-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VERSION }}-${{ matrix.layer }}-
      - name: Result cache directory
        run: mkdir -p "$RUNNER_TEMP/results"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/results
          key: results-v1-${{ matrix.layer }}-${{ matrix.part }}-${{ github.run_id }}
          restore-keys: results-v1-${{ matrix.layer }}-${{ matrix.part }}-
      # The toolchain fingerprint is part of the result cache key (compilers, wasmtime, wasi-libc
      # headers); the sources are keyed per crate by tools/testrun.py itself.
      - name: Run ${{ matrix.layer }}
        run: |
          SHARD=""
          if [ -n "${{ matrix.part }}" ]; then SHARD="${{ matrix.part }}/${{ matrix.parts }}"; fi
          python3 tools/ci_test_report.py --out test-report -- \
            docker run --rm -v "$PWD/test-report:/report" -e NEXTSSL_REPORT_DIR=/report \
            -v "$RUNNER_TEMP/ccache:/ccache" -e NEXTSSL_C_CACHE=/ccache             -v "$RUNNER_TEMP/results:/results" -e NEXTSSL_RESULT_CACHE=/results \
            -e NEXTSSL_IMAGE_ID="$TOOLCHAIN_FP" \
            -e NEXTSSL_SHARD="$SHARD" -e CARGO_INCREMENTAL -e CARGO_PROFILE_DEV_DEBUG \
            -v "$PWD/wasm-out:/wasm-out" -e NEXTSSL_WASM_OUT=/wasm-out \
            -e NEXTSSL_SKIP_BASE=1 -e ${{ matrix.env }} nextssl-test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-report-${{ matrix.layer }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: test-report/
          if-no-files-found: warn
      # The browser module built by the last wasm shard (docker/test.sh), published as is by the wasm
      # pre-release job below.
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.layer == 'wasm' && matrix.part == matrix.parts && needs.guard.outputs.release == 'true' }}
        with:
          name: wasm-module
          path: wasm-out/nextssl_wasm.wasm
          if-no-files-found: error
      # The container wrote the cache as root.
      - name: Prune the C library cache
        if: ${{ !cancelled() && (matrix.part == '' || matrix.part == '1') && github.event_name == 'push' }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ccache"
          python3 tools/ccache_prune.py "$RUNNER_TEMP/ccache" "$RUNNER_TEMP/ccache-stamp"
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && (matrix.part == '' || matrix.part == '1') && github.event_name == 'push' }}
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CACHE_VERSION }}-${{ matrix.layer }}-${{ github.run_id }}
      - name: Result cache owner
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/results"
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          path: ${{ runner.temp }}/results
          key: results-v1-${{ matrix.layer }}-${{ matrix.part }}-${{ github.run_id }}

  release-build-wasm:
    name: wasm / pre-release
    # After the wasm tests (and the other docker layers) passed. The module is the one the last wasm
    # shard built and tested (artifact wasm-module); it is not built a second time.
    needs: [guard, docker]
    if: needs.guard.outputs.release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wasm-module
          path: wasm-out
      - name: Package
        run: bash tools/release_package.sh wasm
      - uses: actions/upload-artifact@v7
        with:
          name: release-wasm
          path: dist/
          if-no-files-found: error
      - name: Pre-release (wasm)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci_release.sh platform wasm

  # The release v<version> with every platform's files: only after every job above passed (each
  # platform chain with its own pre-release, wasm, asan, miri, symbols, fuzz-smoke). Marked pre-release
  # while release.toml says stage = "pre-release" (tools/ci_release.sh).
  release:
    name: release
    needs: [guard, linux-x64, linux-arm64, windows-x64, windows-arm64, macos-arm64, docker, release-build-wasm]
    if: needs.guard.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The platform jobs' checksum files are not part of the release; ci_release.sh writes one SHA256SUMS.
          rm -f dist/SHA256SUMS*
          bash tools/ci_release.sh final
