name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every push to main (owner decision 2026-11-24) builds, lints and tests every algorithm on every
# platform. Each platform publishes its own pre-release v<version>-pre.<commit>.<platform> as soon as
# its chain is green; the final release v<version> follows when every platform is green (owner
# decision 2026-11-25). Pull requests run the same checks without a release.
#
# Pipeline (owner decision 2026-11-24: stages one after another, each platform on its own line):
#   guard  ->  <platform> test 1/3, 2/3, 3/3  ->  <platform> release + pre-release  ->  release
#          ->  wasm 1/2, 2/2                  ->  wasm release + pre-release        ->
#          ->  asan 1/2, 2/2, symbols, miri, fuzz-smoke                             ->
# * guard: the checks that do not depend on the platform (generated files, change paper, rustfmt),
#   a few minutes; nothing else starts when they fail.
# * Each platform chain is .github/workflows/platform.yml; a platform's release libraries are built
#   only after its 3 test shards passed, without waiting for the other platforms.
# * Shards are of about equal expected time (tools/testrun.py --shard, tools/ci_weights.tsv); shard 1
#   also tests the crates that link the whole catalog (registry, ffi, root), copyleft and heavy on.
# * clippy runs in the same compile as the tests (testrun.py --clippy), warnings are errors.
# * Every test runs in its own process with a time limit; a failure, crash or hang fails only that
#   test and is reported per algorithm in the artifact test-report-<job>.
# * C library cache (crates/nextssl-cbuild): a compiled, renamed static library is reused only when
#   two digests (SHA-256 and BLAKE3) of every input match bit for bit. Test and release builds keep
#   separate caches (different optimisation levels); only runs on main write them.
# * Result cache (tools/testrun.py --result-cache): a crate whose inputs (its family directory, its
#   path dependencies, third_party/, docker/, Cargo.lock, the toolchain, the build environment and
#   the test options) are bit for bit those of an earlier run where it compiled and all its tests
#   passed is not built or tested again; the report counts it as cached.
# * Docker layer cache: in the GitHub container registry (ghcr.io/<owner>/nextssl-buildcache, with
#   the workflow's own GITHUB_TOKEN), not in the 10 GB Actions cache; only pushes to main write it.
# * release: the final (non-pre-release) draft v<version>, after every job above passed and the
#   artifacts were checked; once per version.
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CACHE_VERSION: ccache-v1

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Generated files, change paper, formatting, Python tools
        run: |
          cargo xtask gen --check
          python3 tools/upstream_changes.py --check
          python3 tools/release_info.py --check
          python3 tools/licenses_gen.py --check
          cargo fmt --all --check
          python3 -m py_compile tools/*.py

  linux-x64:
    needs: guard
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/platform.yml
    with: { name: linux-x64, os: ubuntu-latest, release: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" }
  linux-arm64:
    needs: guard
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/platform.yml
    with: { name: linux-arm64, os: ubuntu-24.04-arm, release: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" }
  windows-x64:
    needs: guard
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/platform.yml
    with: { name: windows-x64, os: windows-latest, release: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" }
  windows-arm64:
    needs: guard
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/platform.yml
    with: { name: windows-arm64, os: windows-11-arm, release: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" }
  macos-arm64:
    needs: guard
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/platform.yml
    with: { name: macos-arm64, os: macos-latest, release: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" }

  # Docker jobs: wasm (both wasm targets, tests in wasmtime) and the slow layers, in the same image the
  # owner uses locally (docker/Dockerfile.test); docker/test.sh selects the work from the env flags.
  docker:
    needs: guard
    permissions:
      contents: read
      packages: write
    name: ${{ matrix.layer }}${{ matrix.part && format(' {0}/2', matrix.part) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { layer: wasm, env: NEXTSSL_WASM=1, part: '1' }
          - { layer: wasm, env: NEXTSSL_WASM=1, part: '2' }
          - { layer: asan, env: NEXTSSL_ASAN=1, part: '1' }
          - { layer: asan, env: NEXTSSL_ASAN=1, part: '2' }
          - { layer: symbols, env: NEXTSSL_SYMBOLS=1, part: '' }
          - { layer: miri, env: NEXTSSL_MIRI=1, part: '' }
          - { layer: fuzz-smoke, env: NEXTSSL_FUZZ_SECS=30, part: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Layer cache reference
        run: echo "BUILDCACHE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nextssl-buildcache:test" >> "$GITHUB_ENV"
      # A failed login only loses the layer cache; the image is then built from scratch.
      - uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.test
          tags: nextssl-test
          load: true
          cache-from: type=registry,ref=${{ env.BUILDCACHE }}
          cache-to: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.layer == 'symbols') && format('type=registry,ref={0},mode=max', env.BUILDCACHE) || '' }}
      - name: C library cache directory
        run: |
          mkdir -p "$RUNNER_TEMP/ccache" test-report
          touch "$RUNNER_TEMP/ccache-stamp"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CACHE_VERSION }}-${{ matrix.layer }}-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VERSION }}-${{ matrix.layer }}-
      - name: Result cache directory
        run: mkdir -p "$RUNNER_TEMP/results"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/results
          key: results-v1-${{ matrix.layer }}-${{ matrix.part }}-${{ github.run_id }}
          restore-keys: results-v1-${{ matrix.layer }}-${{ matrix.part }}-
      # The image id is part of the cache key (its compilers and wasi-libc headers).
      - name: Run ${{ matrix.layer }}
        run: |
          SHARD=""
          if [ -n "${{ matrix.part }}" ]; then SHARD="${{ matrix.part }}/2"; fi
          python3 tools/ci_test_report.py --out test-report -- \
            docker run --rm -v "$PWD/test-report:/report" -e NEXTSSL_REPORT_DIR=/report \
            -v "$RUNNER_TEMP/ccache:/ccache" -e NEXTSSL_C_CACHE=/ccache             -v "$RUNNER_TEMP/results:/results" -e NEXTSSL_RESULT_CACHE=/results \
            -e NEXTSSL_IMAGE_ID="$(docker image inspect nextssl-test --format '{{.Id}}')" \
            -e NEXTSSL_SHARD="$SHARD" -e CARGO_INCREMENTAL -e CARGO_PROFILE_DEV_DEBUG \
            -e NEXTSSL_SKIP_BASE=1 -e ${{ matrix.env }} nextssl-test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-report-${{ matrix.layer }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: test-report/
          if-no-files-found: warn
      # The container wrote the cache as root.
      - name: Prune the C library cache
        if: ${{ !cancelled() && matrix.part != '2' && github.event_name == 'push' }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ccache"
          python3 tools/ccache_prune.py "$RUNNER_TEMP/ccache" "$RUNNER_TEMP/ccache-stamp"
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && matrix.part != '2' && github.event_name == 'push' }}
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CACHE_VERSION }}-${{ matrix.layer }}-${{ github.run_id }}
      - name: Result cache owner
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/results"
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          path: ${{ runner.temp }}/results
          key: results-v1-${{ matrix.layer }}-${{ matrix.part }}-${{ github.run_id }}

  release-build-wasm:
    name: wasm / pre-release
    # After the wasm tests (and the other docker layers) passed.
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Layer cache reference
        run: echo "BUILDCACHE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nextssl-buildcache:test" >> "$GITHUB_ENV"
      # A failed login only loses the layer cache; the image is then built from scratch.
      - uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.test
          tags: nextssl-test
          load: true
          cache-from: type=registry,ref=${{ env.BUILDCACHE }}
      # The browser module (release) only; the wasm tests run in the docker job above.
      - name: Build wasm release
        run: |
          mkdir -p wasm-out
          docker run --rm -e CARGO_TARGET_DIR=/tmp/t -v "$PWD/wasm-out:/out" nextssl-test bash -c '
            export CC_wasm32_unknown_unknown=clang AR_wasm32_unknown_unknown=llvm-ar
            export CFLAGS_wasm32_unknown_unknown="--target=wasm32-wasip1 -isystem /usr/include/wasm32-wasi"
            export CXX_wasm32_unknown_unknown=clang++
            export CXXFLAGS_wasm32_unknown_unknown="--target=wasm32-wasip1 -isystem /usr/include/wasm32-wasi/c++/v1 -isystem /usr/include/wasm32-wasi"
            export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS="--cfg getrandom_backend=\"wasm_js\" -C link-arg=-L/usr/lib/wasm32-wasi -C link-arg=-lc"
            cargo build -p nextssl-wasm --target wasm32-unknown-unknown --release --locked &&
            cp /tmp/t/wasm32-unknown-unknown/release/nextssl_wasm.wasm /out/'
      - name: Package
        run: bash tools/release_package.sh wasm
      - uses: actions/upload-artifact@v7
        with:
          name: release-wasm
          path: dist/
          if-no-files-found: error
      - name: Pre-release (wasm)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci_release.sh platform wasm

  # The release of the run, v<version>+<commit> with every platform's files: only after every job above
  # passed (each platform chain with its own pre-release, wasm, asan, miri, symbols, fuzz-smoke). Marked
  # pre-release while release.toml says stage = "pre-release" for the version base (tools/ci_release.sh).
  release:
    name: release
    needs: [linux-x64, linux-arm64, windows-x64, windows-arm64, macos-arm64, docker, release-build-wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The platform jobs' checksum files are not part of the release; ci_release.sh writes one SHA256SUMS.
          rm -f dist/SHA256SUMS*
          bash tools/ci_release.sh final
