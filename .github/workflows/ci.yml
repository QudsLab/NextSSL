name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every push to main (owner decision 2026-11-24): every algorithm is built, linted and tested on every
# platform, and the same run builds the release libraries from source and publishes the pre-release
# v<version>+<commit> when everything is green. Pull requests run the same checks without a release.
#
# * Each platform's workspace is split into 3 shards of about equal expected time (tools/testrun.py
#   --shard, weights in tools/ci_weights.tsv). Shard 1 also tests the crates that link the whole
#   catalog (registry, ffi, root), with the copyleft and heavy algorithms enabled.
# * clippy runs inside the same compile as the tests (testrun.py --clippy), warnings are errors.
# * Every test runs in its own process with a time limit; a failure, crash or hang fails only that test
#   and is reported per algorithm in the artifact test-report-<job>.
# * C library cache (crates/nextssl-cbuild, test jobs only): a compiled, renamed static library is
#   reused only when two digests (SHA-256 and BLAKE3) of every input match bit for bit: all crate
#   files, watched paths, Cargo.lock, compiler identity, the C build environment and the runner image.
#   Each stored library is checked against its own two digests before use. Shard 1 of a platform
#   builds every library and saves the cache, only on push to main; release builds never use it.
# * CI builds carry no debug info (smaller objects, faster compile and link); a panic still names its
#   file and line, and the ASan layer adds -g itself.
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CACHE_VERSION: ccache-v1

jobs:
  test:
    name: test (${{ matrix.config.name }} ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
          - { name: macos-arm64, os: macos-latest }
        shard: [1, 2, 3]
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Registry and git checkouts only. Swatinem/rust-cache kept the whole 1924-member workspace in its
      # post-step state and its node process failed with "Argument list too long".
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Several C upstreams need clang-cl on MSVC targets (C99 VLAs, GNU vector types). The x64 image
      # ships LLVM; install it where it is missing (the arm64 image).
      - name: clang-cl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\clang-cl.exe')) { choco install llvm -y --no-progress }
      - name: C library cache directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ccache"
          touch "$RUNNER_TEMP/ccache-stamp"
          echo "NEXTSSL_C_CACHE=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CACHE_VERSION }}-${{ matrix.config.name }}-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VERSION }}-${{ matrix.config.name }}-
      # Generated files, the change paper and formatting do not depend on the OS. On Windows
      # `cargo fmt --all` overflows the 32 KiB command line, so these run on linux-x64 once.
      - name: Generated files, change paper, formatting
        if: matrix.config.name == 'linux-x64' && matrix.shard == 1
        run: |
          cargo xtask gen --check
          python3 tools/upstream_changes.py --check
          cargo fmt --all --check
      # The C toolchain in the log, so a local run can use the same versions (run 45035640571).
      - name: C toolchain versions
        shell: bash
        run: |
          cc --version 2>/dev/null | head -1 || true
          clang --version 2>/dev/null | head -1 || true
          if [ "$RUNNER_OS" = Windows ]; then "/c/Program Files/LLVM/bin/clang-cl.exe" --version | head -1; fi
      # The registry smoke walks the whole catalog in one test: SMOKE_JOBS runs 4 algorithms at a time
      # inside it, and it gets a longer limit than a single algorithm's test.
      - name: Build, lint and test (shard ${{ matrix.shard }}/3)
        shell: bash
        env:
          SMOKE_JOBS: '4'
        run: >-
          python tools/testrun.py --out test-report --timings --clippy --shard ${{ matrix.shard }}/3
          --umbrella-features nextssl-registry/copyleft,nextssl-registry/all-heavy
          --timeout 600 --crate-timeout nextssl-registry=1800 -- --workspace
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-report-${{ matrix.config.name }}-${{ matrix.shard }}
          path: test-report/
          if-no-files-found: warn
      # Shard 1 built every library of the platform; keep only the entries this run used.
      - name: Prune the C library cache
        if: ${{ !cancelled() && matrix.shard == 1 && github.event_name == 'push' }}
        shell: bash
        run: python tools/ccache_prune.py "$NEXTSSL_C_CACHE" "$RUNNER_TEMP/ccache-stamp"
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && matrix.shard == 1 && github.event_name == 'push' }}
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CACHE_VERSION }}-${{ matrix.config.name }}-${{ github.run_id }}

  # Docker jobs: wasm (both wasm targets, tests in wasmtime) and the slow layers, in the same image the
  # owner uses locally (docker/Dockerfile.test); docker/test.sh selects the work from the env flags.
  docker:
    name: ${{ matrix.layer }}${{ matrix.part && format(' {0}/2', matrix.part) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { layer: wasm, env: NEXTSSL_WASM=1, part: '1' }
          - { layer: wasm, env: NEXTSSL_WASM=1, part: '2' }
          - { layer: asan, env: NEXTSSL_ASAN=1, part: '1' }
          - { layer: asan, env: NEXTSSL_ASAN=1, part: '2' }
          - { layer: symbols, env: NEXTSSL_SYMBOLS=1, part: '' }
          - { layer: miri, env: NEXTSSL_MIRI=1, part: '' }
          - { layer: fuzz-smoke, env: NEXTSSL_FUZZ_SECS=30, part: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.test
          tags: nextssl-test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: C library cache directory
        run: |
          mkdir -p "$RUNNER_TEMP/ccache" test-report
          touch "$RUNNER_TEMP/ccache-stamp"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CACHE_VERSION }}-${{ matrix.layer }}-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VERSION }}-${{ matrix.layer }}-
      # The image id is part of the cache key (its compilers and wasi-libc headers).
      - name: Run ${{ matrix.layer }}
        run: |
          SHARD=""
          if [ -n "${{ matrix.part }}" ]; then SHARD="${{ matrix.part }}/2"; fi
          python3 tools/ci_test_report.py --out test-report -- \
            docker run --rm -v "$PWD/test-report:/report" -e NEXTSSL_REPORT_DIR=/report \
            -v "$RUNNER_TEMP/ccache:/ccache" -e NEXTSSL_C_CACHE=/ccache \
            -e NEXTSSL_IMAGE_ID="$(docker image inspect nextssl-test --format '{{.Id}}')" \
            -e NEXTSSL_SHARD="$SHARD" -e CARGO_INCREMENTAL -e CARGO_PROFILE_DEV_DEBUG \
            -e NEXTSSL_SKIP_BASE=1 -e ${{ matrix.env }} nextssl-test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-report-${{ matrix.layer }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: test-report/
          if-no-files-found: warn
      # The container wrote the cache as root.
      - name: Prune the C library cache
        if: ${{ !cancelled() && matrix.part != '2' && github.event_name == 'push' }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ccache"
          python3 tools/ccache_prune.py "$RUNNER_TEMP/ccache" "$RUNNER_TEMP/ccache-stamp"
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && matrix.part != '2' && github.event_name == 'push' }}
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CACHE_VERSION }}-${{ matrix.layer }}-${{ github.run_id }}

  # Release libraries, from source (no C library cache), at the same time as the tests; published by
  # the `publish` job only when every test job above passed.
  release-build:
    name: release-build (${{ matrix.name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
          - { name: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: clang-cl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\clang-cl.exe')) { choco install llvm -y --no-progress }
      - run: cargo build -p nextssl-ffi --release --locked
      - name: Package
        shell: bash
        run: bash tools/release_package.sh "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release-build-wasm:
    name: release-build (wasm)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.test
          tags: nextssl-test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The browser module (release) only; the wasm tests run in the docker job above.
      - name: Build wasm release
        run: |
          mkdir -p wasm-out
          docker run --rm -e CARGO_TARGET_DIR=/tmp/t -v "$PWD/wasm-out:/out" nextssl-test bash -c '
            export CC_wasm32_unknown_unknown=clang AR_wasm32_unknown_unknown=llvm-ar
            export CFLAGS_wasm32_unknown_unknown="--target=wasm32-wasip1 -isystem /usr/include/wasm32-wasi"
            export CXX_wasm32_unknown_unknown=clang++
            export CXXFLAGS_wasm32_unknown_unknown="--target=wasm32-wasip1 -isystem /usr/include/wasm32-wasi/c++/v1 -isystem /usr/include/wasm32-wasi"
            export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS="--cfg getrandom_backend=\"wasm_js\" -C link-arg=-L/usr/lib/wasm32-wasi -C link-arg=-lc"
            cargo build -p nextssl-wasm --target wasm32-unknown-unknown --release --locked &&
            cp /tmp/t/wasm32-unknown-unknown/release/nextssl_wasm.wasm /out/'
      - name: Package
        run: bash tools/release_package.sh wasm
      - uses: actions/upload-artifact@v4
        with:
          name: release-wasm
          path: dist/
          if-no-files-found: error

  publish:
    name: publish pre-release
    needs: [test, docker, release-build, release-build-wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create GitHub pre-release v<version>+<commit>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          TAG="v${VER}+${GITHUB_SHA::7}"
          (cd dist && sha256sum * > SHA256SUMS)
          cat > notes.md <<EOF
          Automatic pre-release of commit ${GITHUB_SHA} (version ${VER}).
          Built and tested on Linux x64/arm64, Windows x64/arm64, macOS arm64 and wasm by CI run
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.
          Each archive holds the nextssl-ffi libraries, the C header and the license of every bundled
          upstream; release libraries are built from source. Tested against published KAT vectors;
          not FIPS validated. Changes to upstream sources: docs/UPSTREAM_CHANGES.md.
          EOF
          # --draft: only the owner sees it until the license policy for the 1052 algorithms whose
          # algo.toml says NOASSERTION is decided (CLAUDE.md rule 3). Remove --draft to publish.
          gh release create "$TAG" dist/* --draft --prerelease --target "$GITHUB_SHA" --title "NextSSL $TAG" --notes-file notes.md
