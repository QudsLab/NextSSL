[package]
name = "nextssl-core"
description = "NextSSL core: errors, params, tiers and algorithm traits"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Deterministic entropy source for KAT runners (FixedEntropy). Never part of a release build.
testing = []

[dependencies]
subtle.workspace = true
zeroize.workspace = true
base64ct.workspace = true

# No build script uses this. Every C-backed algorithm depends on nextssl-core, so Cargo's feature
# unification turns on cc's `parallel` feature for all of their build scripts: the C files of one crate
# compile at the same time (cargo's jobserver caps the total), instead of one after another. Same objects.
[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[lints]
workspace = true
