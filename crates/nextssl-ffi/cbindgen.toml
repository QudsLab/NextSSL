language = "C"
include_guard = "NEXTSSL_H"
cpp_compat = true
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
autogen_warning = "/* Generated by cargo xtask gen (cbindgen). Do not edit. */"
documentation = true
documentation_style = "c99"

[export]
include = []

[export.rename]
"NextsslIn" = "nextssl_in"
"NextsslOut" = "nextssl_out"

[fn]
sort_by = "Name"

[parse]
parse_deps = false
